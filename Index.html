<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interactive Quiz Engine</title>
  <!-- PapaParse for reading CSV files -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
  <!-- Google Fonts for modern typography -->
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #4158D0 0%, #C850C0 46%, #FFCC70 100%);
      --card-bg: #ffffff;
      --text-dark: #2D3748;
      --primary-purple: #7C3AED;
      --primary-purple-hover: #6D28D9;
      --accent-pink: #EC4899;
      --accent-green: #10B981;
      --accent-yellow: #F59E0B;
      --accent-blue: #3B82F6;
      --border-radius: 20px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Nunito', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: var(--bg-gradient);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }

    .quiz-container {
      background: var(--card-bg);
      width: 100%;
      max-width: 500px;
      border-radius: var(--border-radius);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
      padding: 28px 20px;
      position: relative;
      overflow: hidden;
      transition: transform 0.2s ease;
    }

    h1, h2, h3 {
      font-family: 'Fredoka', sans-serif;
      color: var(--text-dark);
      text-align: center;
    }

    /* Upload Screen Styling */
    .upload-box {
      text-align: center;
      padding: 20px 10px;
    }

    .upload-box h1 {
      font-size: 1.8rem;
      margin-bottom: 8px;
      color: var(--primary-purple);
    }

    .upload-box p {
      color: #64748B;
      font-size: 0.95rem;
      margin-bottom: 24px;
    }

    .custom-file-upload {
      display: inline-block;
      width: 100%;
      padding: 16px;
      background: var(--bg-gradient);
      color: white;
      font-weight: 800;
      font-size: 1.1rem;
      border-radius: 14px;
      cursor: pointer;
      box-shadow: 0 6px 15px rgba(236, 72, 153, 0.3);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .custom-file-upload:active {
      transform: scale(0.98);
    }

    input[type="file"] {
      display: none;
    }

    /* Header & Progress Info */
    .quiz-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .progress-pill {
      background: #F1F5F9;
      color: var(--primary-purple);
      padding: 6px 14px;
      border-radius: 20px;
      font-weight: 800;
      font-size: 0.85rem;
    }

    .question-title {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--text-dark);
      margin-bottom: 20px;
      text-align: left;
      line-height: 1.4;
    }

    /* Options Container Grid */
    .options-grid {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .option-btn {
      width: 100%;
      min-height: 56px;
      padding: 14px 18px;
      border: 3px solid #E2E8F0;
      background: #FFFFFF;
      color: var(--text-dark);
      border-radius: 14px;
      font-size: 1rem;
      font-weight: 700;
      text-align: left;
      cursor: pointer;
      transition: all 0.15s ease-in-out;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 4px 0 #E2E8F0;
    }

    /* Vibrant color variations per option */
    .option-btn:nth-child(1) { border-color: #3B82F6; box-shadow: 0 4px 0 #2563EB; color: #1E40AF; }
    .option-btn:nth-child(2) { border-color: #EC4899; box-shadow: 0 4px 0 #DB2777; color: #9D174D; }
    .option-btn:nth-child(3) { border-color: #10B981; box-shadow: 0 4px 0 #059669; color: #065F46; }
    .option-btn:nth-child(4) { border-color: #F59E0B; box-shadow: 0 4px 0 #D97706; color: #92400E; }

    .option-btn:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 transparent !important;
    }

    /* Result Screen */
    .result-box {
      text-align: center;
      padding: 10px 0;
    }

    .score-circle {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: var(--bg-gradient);
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: 20px auto;
      box-shadow: 0 10px 20px rgba(124, 58, 237, 0.3);
    }

    .score-number {
      font-size: 2.2rem;
      font-family: 'Fredoka', sans-serif;
      line-height: 1;
    }

    .score-label {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .restart-btn {
      margin-top: 20px;
      width: 100%;
      padding: 16px;
      background: var(--primary-purple);
      color: white;
      border: none;
      border-radius: 14px;
      font-size: 1.1rem;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 6px 0 var(--primary-purple-hover);
      transition: all 0.15s ease;
    }

    .restart-btn:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 var(--primary-purple-hover);
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>

<div class="quiz-container">
  <!-- Upload Screen -->
  <div id="upload-screen" class="upload-box">
    <h1>🎮 Quiz Master</h1>
    <p>Upload your CSV question bank to start playing!</p>
    <label for="csv-file" class="custom-file-upload">
      📁 Select CSV File
    </label>
    <input type="file" id="csv-file" accept=".csv" />
  </div>

  <!-- Quiz Screen -->
  <div id="quiz-screen" class="hidden">
    <div class="quiz-header">
      <span class="progress-pill" id="progress-text">Question 1/10</span>
    </div>
    <h2 class="question-title" id="question-text">Question loading...</h2>
    <div class="options-grid" id="options-container"></div>
  </div>

  <!-- Result Screen -->
  <div id="result-screen" class="hidden result-box">
    <h1>🎉 Quiz Completed!</h1>
    <div class="score-circle">
      <span class="score-number" id="final-score">0/0</span>
      <span class="score-label">Score</span>
    </div>
    <p id="feedback-text" style="color: #64748B; font-weight: 700;"></p>
    <button class="restart-btn" onclick="location.reload()">🔄 Load New Quiz</button>
  </div>
</div>

<script>
  let questions = [];
  let currentIndex = 0;
  let score = 0;

  document.getElementById('csv-file').addEventListener('change', function(e) {
    const file = e.target.files[0];
    if (!file) return;

    Papa.parse(file, {
      header: true,
      skipEmptyLines: true,
      complete: function(results) {
        questions = results.data;
        if (questions.length > 0) {
          document.getElementById('upload-screen').classList.add('hidden');
          document.getElementById('quiz-screen').classList.remove('hidden');
          showQuestion();
        } else {
          alert('Invalid CSV file or empty dataset.');
        }
      }
    });
  });

  function showQuestion() {
    const q = questions[currentIndex];
    
    // Update question count pill
    document.getElementById('progress-text').innerText = `Question ${currentIndex + 1} of ${questions.length}`;
    document.getElementById('question-text').innerText = q.Question;
    
    const container = document.getElementById('options-container');
    container.innerHTML = '';

    // Collect choices dynamically
    const choices = [q.OptionA, q.OptionB, q.OptionC, q.OptionD].filter(Boolean);

    choices.forEach(choice => {
      const btn = document.createElement('button');
      btn.className = 'option-btn';
      btn.innerText = choice;
      btn.onclick = () => selectAnswer(choice, q.Correct);
      container.appendChild(btn);
    });
  }

  function selectAnswer(selected, correct) {
    if (selected.trim().toLowerCase() === correct.trim().toLowerCase()) {
      score++;
    }
    currentIndex++;
    if (currentIndex < questions.length) {
      showQuestion();
    } else {
      showResults();
    }
  }

  function showResults() {
    document.getElementById('quiz-screen').classList.add('hidden');
    document.getElementById('result-screen').classList.remove('hidden');
    
    document.getElementById('final-score').innerText = `${score}/${questions.length}`;
    
    const percentage = (score / questions.length) * 100;
    const feedback = document.getElementById('feedback-text');
    
    if (percentage === 100) feedback.innerText = "🏆 Perfect Score! You're a Genius!";
    else if (percentage >= 70) feedback.innerText = "🌟 Great job! Almost perfect!";
    else if (percentage >= 50) feedback.innerText = "👍 Good effort! Keep practicing.";
    else feedback.innerText = "💪 Don't give up! Try again.";
  }
</script>

</body>
</html>
